<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="Headset icon">
  <!-- background (sampled from your image) -->
  <rect width="100%" height="100%" fill="#3EADA9" />

  <!-- ear cups (drawn first so the arch appears on top) -->
  <rect x="140" y="300" width="160" height="240" rx="36" ry="36" fill="#ffffff"/>
  <rect x="500" y="300" width="160" height="240" rx="36" ry="36" fill="#ffffff"/>

  <!-- mic stem + boom (connected rounded rectangles) -->
  <!-- vertical stem -->
  <rect x="620" y="420" width="48" height="140" rx="22" ry="22" fill="#ffffff"/>
  <!-- horizontal boom (extends left and rounded) -->
  <rect x="420" y="520" width="220" height="42" rx="21" ry="21" fill="#ffffff"/>
  <!-- small cut (to mimic original small notch on boom end) -->
  <path d="M620 558 a21 21 0 0 0 21 -21 21 21 0 0 1 -21 21z" fill="#3EADA9"/>

  <!-- top arch (drawn on top so it overlaps earcups with rounded stroke) -->
  <path d="M180 360 A220 220 0 0 1 620 360"
        fill="none"
        stroke="#ffffff"
        stroke-width="80"
        stroke-linecap="round"
        stroke-linejoin="round" />

  <!-- inner white spacing bottom mic-rounded-cap to more closely match image -->
  <rect x="422" y="558" width="120" height="24" rx="12" ry="12" fill="#ffffff"/>
</svg>
